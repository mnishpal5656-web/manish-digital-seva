<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>धान पंजीयन आवेदन - Manish Digital Seva</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f8f5;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 2px 10px #ccc;
}
h1{
  color:#16803c;
  text-align:center;
}
.notice{
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}
label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  box-sizing:border-box;
  border:1px solid #bbb;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:30px;
  background:#25D366;
  color:white;
  font-size:18px;
  font-weight:bold;
}
.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#16803c;
  text-decoration:none;
}
.note{
  background:#e8f5e9;
  padding:12px;
  border-radius:10px;
  margin-top:18px;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
<div class="box">

<h1>🌾 धान उपार्जन पंजीयन</h1>

<div class="notice">
खरीफ 2026-27<br>
📍 केवल ढखरा एवं रायपुर सहकारी समिति
</div>

<p>
कृपया नीचे अपनी जानकारी भरें। जानकारी WhatsApp के माध्यम से
MANISH DIGITAL SEVA & AI CENTER को भेजी जाएगी।
</p>

<label>👤 किसान का नाम</label>
<input id="name" type="text" placeholder="पूरा नाम">

<label>📱 मोबाइल नंबर</label>
<input id="mobile" type="tel" placeholder="मोबाइल नंबर">

<label>🪪 आधार कार्ड नंबर</label>
<input id="aadhaar" type="text" placeholder="आधार नंबर">

<label>🆔 समग्र ID</label>
<input id="samagra" type="text" placeholder="समग्र ID">

<label>🏦 बैंक A/C नंबर</label>
<input id="account" type="text" placeholder="बैंक खाता नंबर">

<label>🏦 बैंक का नाम</label>
<input id="bank" type="text" placeholder="बैंक का नाम">

<label>📄 खसरा नंबर</label>
<input id="khasra" type="text" placeholder="खसरा नंबर">

<label>📋 खतौनी / भूमि संबंधी जानकारी</label>
<textarea id="khatoni" rows="4"
placeholder="खतौनी नंबर / भूमि की जानकारी"></textarea>

<label>🏘️ ग्राम</label>
<input id="village" type="text" placeholder="ग्राम का नाम">

<label>🏢 सहकारी समिति</label>
<select id="samiti">
<option value="">समिति चुनें</option>
<option>ढखरा सहकारी समिति</option>
<option>रायपुर सहकारी समिति</option>
</select>

<button onclick="sendWhatsApp()">
📲 जानकारी WhatsApp पर भेजें
</button>

<div class="note">
📎 आधार, समग्र ID, बैंक पासबुक और खतौनी की
फोटो/PDF WhatsApp चैट में अलग से भेज सकते हैं।
</div>

<a class="back" href="index.html">
⬅️ मुख्य वेबसाइट पर वापस जाएँ
</a>

</div>
</div>

<script>
function sendWhatsApp(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let aadhaar=document.getElementById("aadhaar").value;
let samagra=document.getElementById("samagra").value;
let account=document.getElementById("account").value;
let bank=document.getElementById("bank").value;
let khasra=document.getElementById("khasra").value;
let khatoni=document.getElementById("khatoni").value;
let village=document.getElementById("village").value;
let samiti=document.getElementById("samiti").value;

if(name=="" || mobile=="" || samiti==""){
alert("कृपया किसान का नाम, मोबाइल नंबर और समिति भरें।");
return;
}

let message =
"🌾 खरीफ 2026-27 धान उपार्जन पंजीयन%0A%0A"+
"👤 किसान का नाम: "+name+"%0A"+
"📱 मोबाइल: "+mobile+"%0A"+
"🪪 आधार: "+aadhaar+"%0A"+
"🆔 समग्र ID: "+samagra+"%0A"+
"🏦 बैंक A/C: "+account+"%0A"+
"🏦 बैंक: "+bank+"%0A"+
"📄 खसरा: "+khasra+"%0A"+
"📋 खतौनी: "+khatoni+"%0A"+
"🏘️ ग्राम: "+village+"%0A"+
"🏢 समिति: "+samiti;

window.open(
"https://wa.me/916260988021?text="+message,
"_blank"
);
}
</script>

</body>
</html>
