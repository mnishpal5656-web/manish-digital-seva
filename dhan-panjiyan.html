<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>धान उपार्जन पंजीयन - Manish Digital Seva</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f8f5;
  color:#222;
}
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}
.box{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 2px 10px #ccc;
}
h1{
  color:#16803c;
  text-align:center;
}
.notice{
  background:#fff3cd;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}
label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  box-sizing:border-box;
  border:1px solid #bbb;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:30px;
  background:#25D366;
  color:white;
  font-size:18px;
  font-weight:bold;
}
.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#16803c;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
<div class="box">

<h1>🌾 धान उपार्जन पंजीयन</h1>

<div class="notice">
खरीफ 2026-27<br>
केवल ढखरा एवं रायपुर सहकारी समिति के लिए
</div>

<p>
धान उपार्जन पंजीयन करवाने के लिए नीचे जानकारी भरकर WhatsApp पर भेजें।
</p>

<label>किसान का नाम</label>
<input id="name" type="text" placeholder="अपना नाम लिखें">

<label>मोबाइल नंबर</label>
<input id="mobile" type="tel" placeholder="मोबाइल नंबर">

<label>ग्राम</label>
<input id="village" type="text" placeholder="ग्राम का नाम">

<label>सहकारी समिति</label>
<select id="samiti">
<option value="">समिति चुनें</option>
<option>ढखरा सहकारी समिति</option>
<option>रायपुर सहकारी समिति</option>
</select>

<label>खसरा नंबर</label>
<input id="khasra" type="text" placeholder="खसरा नंबर">

<label>भूमि/धान संबंधी जानकारी</label>
<textarea id="details" rows="4" placeholder="आवश्यक जानकारी लिखें"></textarea>

<button onclick="sendWhatsApp()">
📲 WhatsApp पर पंजीयन जानकारी भेजें
</button>

<a class="back" href="index.html">⬅️ मुख्य वेबसाइट पर वापस जाएँ</a>

</div>
</div>

<script>
function sendWhatsApp(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let village=document.getElementById("village").value;
let samiti=document.getElementById("samiti").value;
let khasra=document.getElementById("khasra").value;
let details=document.getElementById("details").value;

let message =
"🌾 खरीफ 2026-27 धान उपार्जन पंजीयन%0A%0A"+
"किसान का नाम: "+name+"%0A"+
"मोबाइल: "+mobile+"%0A"+
"ग्राम: "+village+"%0A"+
"सहकारी समिति: "+samiti+"%0A"+
"खसरा नंबर: "+khasra+"%0A"+
"अन्य जानकारी: "+details;

window.open(
"https://wa.me/916260988021?text="+message,
"_blank"
);
}
</script>

</body>
</html>
